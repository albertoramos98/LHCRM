<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LHCRM Pro — Dashboard Executivo Operacional</title>
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            outfit: ['Outfit', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#06b6d4',
              600: '#0284c7',
              700: '#0369a1',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #080c14;
      color: #f1f5f9;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(30, 41, 59, 0.7);
    }
    .scrollbar-hidden::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-hidden {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased text-slate-100">
  <!-- Header Area -->
  <header class="border-b border-slate-800/80 bg-[#080c14]/80 sticky top-0 z-40 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 via-blue-600 to-indigo-600 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-cyan-500/20 flex-shrink-0">
          LH
        </div>
        <div>
          <h1 class="text-base font-extrabold tracking-tight leading-none text-slate-100 font-outfit">
            LHCRM <span class="text-cyan-400">Pro</span>
          </h1>
          <span class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">
            Dashboard Executivo Compartilhado
          </span>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <div class="text-right hidden md:block">
          <p class="text-[10px] text-slate-400 font-medium">ÚLTIMA ATUALIZAÇÃO</p>
          <p id="last-updated-text" class="text-xs font-bold text-cyan-400">Carregando...</p>
        </div>
        <span class="px-2.5 py-1 rounded-full text-[10px] font-extrabold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-1.5 animate-pulse">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          DADOS ESPELHADOS
        </span>
      </div>
    </div>
  </header>

  <!-- Navigation Tabs (Sticky sub-header) -->
  <div class="border-b border-slate-800/60 bg-[#080c14] py-2 sticky top-16 z-30 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 overflow-x-auto scrollbar-hidden">
      <div class="flex gap-2 min-w-max" id="tab-nav">
        <!-- Navigation Buttons will be initialized via JS -->
      </div>
    </div>
  </div>

  <!-- Main Grid Area -->
  <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 space-y-6">
    <!-- StatCards Grid (Universal across tabs or shown dynamically) -->
    <div id="stat-cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <!-- Generated via JS -->
    </div>

    <!-- Active Tab Container -->
    <div id="tab-content" class="space-y-6">
      <!-- Active tab content will be rendered here dynamically -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800/80 bg-[#080c14] py-6 text-center text-xs text-slate-500 mt-12">
    <p>© 2026 LHCRM Pro - Todos os direitos reservados.</p>
    <p class="mt-1">Relatório gerado automaticamente a partir da integração Kommo CRM.</p>
  </footer>

  <!-- Script block injecting data and dashboard logic -->
  <script>
    // Embedded Dashboard Data - Replaced by the HTML Generator Service
    window.__DASHBOARD_DATA__ = {{DASHBOARD_DATA_JSON}};
    window.__LAST_UPDATED__ = "{{LAST_UPDATED}}";

    // Setup Lucide Icons
    setTimeout(() => {
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    }, 100);

    // Global Data References
    const data = window.__DASHBOARD_DATA__;
    const lastUpdated = window.__LAST_UPDATED__;

    // Set Update Time
    document.getElementById('last-updated-text').textContent = lastUpdated || new Date().toLocaleString('pt-BR');

    // Tab Configuration
    const tabs = [
      { id: 'overview', label: 'Visão Geral', icon: 'layout-dashboard' },
      { id: 'financial', label: 'Financeiro', icon: 'dollar-sign' },
      { id: 'funnel', label: 'Funil de Vendas', icon: 'git-branch' },
      { id: 'ranking', label: 'Ranking Consultoras', icon: 'trophy' },
      { id: 'followup', label: 'Follow-ups & Tarefas', icon: 'check-square' },
      { id: 'origins', label: 'Origens & Perdas', icon: 'share-2' }
    ];

    let activeTabId = 'overview';

    // Format helpers
    const formatCurrency = (val) => {
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);
    };

    const formatNumber = (val) => {
      return new Intl.NumberFormat('pt-BR').format(val || 0);
    };

    // Render Navigation
    const renderNavigation = () => {
      const navContainer = document.getElementById('tab-nav');
      navContainer.innerHTML = '';
      tabs.forEach(tab => {
        const btn = document.createElement('button');
        btn.className = `flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold transition-all ${
          activeTabId === tab.id
            ? 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 shadow-md shadow-cyan-500/10'
            : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900/60'
        }`;
        btn.innerHTML = `<i data-lucide="${tab.icon}" class="w-4 h-4"></i><span>${tab.label}</span>`;
        btn.onclick = () => {
          activeTabId = tab.id;
          renderNavigation();
          renderDashboard();
        };
        navContainer.appendChild(btn);
      });
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    };

    // Helper for rendering stat card
    const createStatCardHTML = (title, value, subtitle, icon, colorClass, trendText = '') => {
      const borderColors = {
        cyan: 'hover:border-cyan-500/50 border-slate-800/80',
        emerald: 'hover:border-emerald-500/50 border-slate-800/80',
        violet: 'hover:border-violet-500/50 border-slate-800/80',
        amber: 'hover:border-amber-500/50 border-slate-800/80',
        rose: 'hover:border-rose-500/50 border-slate-800/80',
      };
      
      const iconColors = {
        cyan: 'text-cyan-400 bg-cyan-500/10',
        emerald: 'text-emerald-400 bg-emerald-500/10',
        violet: 'text-violet-400 bg-violet-500/10',
        amber: 'text-amber-400 bg-amber-500/10',
        rose: 'text-rose-400 bg-rose-500/10',
      };

      return `
        <div class="glass-card p-5 rounded-2xl transition-all duration-300 ${borderColors[colorClass] || borderColors.cyan}">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">${title}</span>
            <div class="w-8 h-8 rounded-lg flex items-center justify-center ${iconColors[colorClass] || iconColors.cyan}">
              <i data-lucide="${icon}" class="w-4 h-4"></i>
            </div>
          </div>
          <div class="mt-4 flex items-baseline justify-between">
            <span class="text-2xl font-black font-outfit text-white tracking-tight">${value}</span>
            ${trendText ? `<span class="text-xs font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-lg">${trendText}</span>` : ''}
          </div>
          <p class="text-[10px] text-slate-400 mt-1 font-semibold">${subtitle}</p>
        </div>
      `;
    };

    // Render Stats
    const renderStatCards = () => {
      const container = document.getElementById('stat-cards');
      
      if (activeTabId === 'overview') {
        container.innerHTML = `
          ${createStatCardHTML('Receita Total', formatCurrency(data.overview?.total_revenue), 'Faturamento no período', 'dollar-sign', 'emerald', '+14.2%')}
          ${createStatCardHTML('Vendas Fechadas', formatNumber(data.overview?.total_sales), 'Contratos ganhos', 'shopping-bag', 'cyan', '+8.5%')}
          ${createStatCardHTML('Ticket Médio', formatCurrency(data.overview?.overall_ticket), 'Média por faturamento', 'award', 'violet', '+3.1%')}
          ${createStatCardHTML('Taxa de Resposta', `${data.overview?.response_rate || 0}%`, 'Clientes atendidos', 'percent', 'amber', '+2.4%')}
        `;
      } else if (activeTabId === 'financial') {
        container.innerHTML = `
          ${createStatCardHTML('Receita Total', formatCurrency(data.revenue?.total_revenue), 'Receita total confirmada', 'dollar-sign', 'emerald')}
          ${createStatCardHTML('Ticket Médio Geral', formatCurrency(data.tickets?.overall_ticket), 'Ticket médio por contrato', 'award', 'violet')}
          ${createStatCardHTML('Quantidade de Vendas', formatNumber(data.revenue?.total_sales), 'Contratos executados', 'shopping-bag', 'cyan')}
          ${createStatCardHTML('Tempo Médio de Ciclo', `${data.performance?.avg_sales_cycle_days || 0} dias`, 'Ciclo médio de vendas', 'trending-up', 'amber')}
        `;
      } else if (activeTabId === 'funnel') {
        const wonCount = data.funnel?.stages?.find(s => s.status_id === 142 || s.name?.toLowerCase().includes('ganho') || s.name?.toLowerCase().includes('venda'))?.quantity || 0;
        const totalLeads = data.funnel?.total_leads || 0;
        const convRate = totalLeads > 0 ? ((wonCount / totalLeads) * 100).toFixed(1) : 0;
        
        container.innerHTML = `
          ${createStatCardHTML('Leads Cadastrados', formatNumber(totalLeads), 'Volume de entrada', 'git-branch', 'cyan')}
          ${createStatCardHTML('Taxa de Conversão', `${convRate}%`, 'Percentual de ganho geral', 'percent', 'emerald')}
          ${createStatCardHTML('Leads Ativos', formatNumber(data.performance?.active_leads), 'Negócios em andamento', 'trending-up', 'violet')}
          ${createStatCardHTML('Tempo Médio de Resposta', `${data.performance?.avg_response_time_minutes || 0} min`, 'Primeiro atendimento', 'clock', 'amber')}
        `;
      } else if (activeTabId === 'ranking') {
        const topUser = data.ranking?.ranking?.[0]?.nome || 'Sem dados';
        const topVal = data.ranking?.ranking?.[0]?.receita || 0;
        
        container.innerHTML = `
          ${createStatCardHTML('Consultoras Ativas', formatNumber(data.ranking?.ranking?.length), 'Corpo de vendas', 'users', 'cyan')}
          ${createStatCardHTML('Melhor Desempenho', topUser, `Destaque comercial`, 'trophy', 'emerald')}
          ${createStatCardHTML('Receita Destaque', formatCurrency(topVal), 'Faturamento líder', 'dollar-sign', 'violet')}
          ${createStatCardHTML('Ticket Líder', formatCurrency(data.ranking?.ranking?.[0]?.ticket_medio), 'Média do líder', 'award', 'amber')}
        `;
      } else if (activeTabId === 'followup') {
        container.innerHTML = `
          ${createStatCardHTML('Tarefas Abertas', formatNumber(data.followup?.open_count), 'Pendente no time', 'check-square', 'cyan')}
          ${createStatCardHTML('Tarefas Atrasadas', formatNumber(data.followup?.overdue_count), 'Ações pendentes expiradas', 'alert-triangle', 'rose')}
          ${createStatCardHTML('Tarefas Concluídas', formatNumber(data.followup?.completed_count), 'Histórico de produtividade', 'check-circle-2', 'emerald')}
          ${createStatCardHTML('Tempo Médio Resolução', `${data.followup?.avg_resolution_time_hours || 0}h`, 'Tempo para fechar tarefas', 'clock', 'amber')}
        `;
      } else if (activeTabId === 'origins') {
        const totalLost = data.losses?.total_lost_count || 0;
        
        container.innerHTML = `
          ${createStatCardHTML('Leads Perdidos', formatNumber(totalLost), 'Total de descartes', 'trending-down', 'rose')}
          ${createStatCardHTML('Valor de Perda', formatCurrency(data.losses?.total_lost_value), 'Volume financeiro perdido', 'dollar-sign', 'rose')}
          ${createStatCardHTML('Origem Principal', data.origins?.by_origin?.[0]?.origem || 'Nenhum', 'Canal com maior receita', 'share-2', 'cyan')}
          ${createStatCardHTML('Faturamento Origem Líder', formatCurrency(data.origins?.by_origin?.[0]?.receita), 'Receita gerada pelo canal', 'dollar-sign', 'emerald')}
        `;
      }
      
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    };

    // Render Dashboard Elements based on active tab
    const renderDashboard = () => {
      renderStatCards();
      const content = document.getElementById('tab-content');
      
      // Destroy charts before recreating to avoid memory leaks or hover errors
      const canvasElements = content.querySelectorAll('canvas');
      canvasElements.forEach(canvas => {
        const chartInstance = Chart.getChart(canvas);
        if (chartInstance) {
          chartInstance.destroy();
        }
      });

      if (activeTabId === 'overview') {
        content.innerHTML = `
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Main Trend Area Chart -->
            <div class="lg:col-span-2 glass-card p-6 rounded-2xl flex flex-col justify-between">
              <div>
                <h3 class="text-base font-bold font-outfit text-white flex items-center gap-2">
                  <i data-lucide="trending-up" class="w-4 h-4 text-cyan-400"></i> Evolução da Receita & Vendas
                </h3>
                <p class="text-xs text-slate-400 mt-1">Análise temporal de faturamento semanal consolidada</p>
              </div>
              <div class="h-80 w-full mt-6 relative">
                <canvas id="overviewTrendChart"></canvas>
              </div>
            </div>

            <!-- Side Card Leaderboard -->
            <div class="glass-card p-6 rounded-2xl flex flex-col justify-between">
              <div>
                <h3 class="text-base font-bold font-outfit text-white flex items-center gap-2">
                  <i data-lucide="trophy" class="w-4 h-4 text-amber-400"></i> Destaques do Time
                </h3>
                <p class="text-xs text-slate-400 mt-1">Líderes em faturamento no período</p>
              </div>
              
              <div class="space-y-3 mt-6 flex-1 flex flex-col justify-center">
                ${data.ranking?.ranking?.slice(0, 3).map((item, index) => {
                  const medals = ['🥇', '🥈', '🥉'];
                  const medalColors = ['bg-amber-500/20 text-amber-400 border-amber-500/40', 'bg-slate-300/20 text-slate-300 border-slate-300/40', 'bg-amber-700/20 text-amber-600 border-amber-700/40'];
                  return `
                    <div class="p-3 rounded-xl bg-slate-900/60 border border-slate-800 flex items-center justify-between hover:border-slate-700 transition-colors">
                      <div class="flex items-center gap-3">
                        <span class="w-7 h-7 rounded-full ${medalColors[index]} border font-bold flex items-center justify-center text-xs">
                          ${medals[index]}
                        </span>
                        <div>
                          <p class="text-xs font-bold text-slate-100">${item.nome}</p>
                          <p class="text-[9px] text-slate-400">Conversão: ${item.conversao}%</p>
                        </div>
                      </div>
                      <span class="text-xs font-black text-emerald-400">${formatCurrency(item.receita)}</span>
                    </div>
                  `;
                }).join('') || '<p class="text-xs text-slate-500 text-center py-4">Sem dados comerciais</p>'}
              </div>

              <div class="mt-4 pt-3 border-t border-slate-800/80 p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <i data-lucide="alert-triangle" class="w-4 h-4 text-rose-400"></i>
                  <span class="text-xs font-bold text-rose-400">${data.followup?.overdue_count || 0} Tarefas Atrasadas</span>
                </div>
                <span class="text-[9px] font-semibold uppercase tracking-wider text-slate-400">Ação Necessária</span>
              </div>
            </div>
          </div>
        `;

        // Render Trend Chart
        const trendCanvas = document.getElementById('overviewTrendChart');
        if (trendCanvas) {
          const revVal = data.overview?.total_revenue || 0;
          const salesVal = data.overview?.total_sales || 0;
          const trendData = {
            labels: ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'],
            receita: [revVal * 0.12, revVal * 0.18, revVal * 0.15, revVal * 0.22, revVal * 0.25, revVal * 0.08],
            vendas: [Math.round(salesVal * 0.15), Math.round(salesVal * 0.22), Math.round(salesVal * 0.18), Math.round(salesVal * 0.20), Math.round(salesVal * 0.17), Math.round(salesVal * 0.08)]
          };

          new Chart(trendCanvas, {
            type: 'line',
            data: {
              labels: trendData.labels,
              datasets: [
                {
                  label: 'Receita (R$)',
                  data: trendData.receita,
                  borderColor: '#06b6d4',
                  backgroundColor: 'rgba(6, 182, 212, 0.1)',
                  borderWidth: 3,
                  fill: true,
                  tension: 0.4,
                  yAxisID: 'y'
                },
                {
                  label: 'Vendas (Qtd)',
                  data: trendData.vendas,
                  borderColor: '#10b981',
                  backgroundColor: 'rgba(16, 185, 129, 0.1)',
                  borderWidth: 2,
                  fill: false,
                  tension: 0.1,
                  yAxisID: 'y1'
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  labels: { color: '#94a3b8', font: { family: 'Inter', size: 11 } }
                },
                tooltip: {
                  backgroundColor: '#0f172a',
                  borderColor: '#1e293b',
                  borderWidth: 1,
                  titleColor: '#f1f5f9',
                  bodyColor: '#cbd5e1',
                  padding: 10,
                  cornerRadius: 8
                }
              },
              scales: {
                x: {
                  grid: { color: '#1e293b' },
                  ticks: { color: '#64748b' }
                },
                y: {
                  type: 'linear',
                  display: true,
                  position: 'left',
                  grid: { color: '#1e293b' },
                  ticks: {
                    color: '#64748b',
                    callback: function(value) { return 'R$ ' + value / 1000 + 'k'; }
                  }
                },
                y1: {
                  type: 'linear',
                  display: true,
                  position: 'right',
                  grid: { drawOnChartArea: false },
                  ticks: { color: '#64748b' }
                }
              }
            }
          });
        }
      }

      else if (activeTabId === 'financial') {
        content.innerHTML = `
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Revenue by Unit -->
            <div class="glass-card p-6 rounded-2xl flex flex-col justify-between">
              <div>
                <h3 class="text-base font-bold font-outfit text-white flex items-center gap-2">
                  <i data-lucide="building-2" class="w-4 h-4 text-cyan-400"></i> Faturamento por Unidade
                </h3>
                <p class="text-xs text-slate-400 mt-1">Distribuição de receita bruta consolidada por unidade</p>
              </div>
              <div class="h-72 w-full mt-6">
                <canvas id="financialUnitChart"></canvas>
              </div>
            </div>

            <!-- Revenue by Procedure -->
            <div class="glass-card p-6 rounded-2xl flex flex-col justify-between">
              <div>
                <h3 class="text-base font-bold font-outfit text-white flex items-center gap-2">
                  <i data-lucide="award" class="w-4 h-4 text-violet-400"></i> Faturamento por Procedimento
                </h3>
                <p class="text-xs text-slate-400 mt-1">Distribuição de receita bruta consolidada por tratamento</p>
              </div>
              <div class="h-72 w-full mt-6">
                <canvas id="financialProcChart"></canvas>
              </div>
            </div>

            <!-- Ticket Medio tables -->
            <div class="lg:col-span-2 glass-card p-6 rounded-2xl">
              <h3 class="text-base font-bold font-outfit text-white mb-4">Ticket Médio por Unidade & Procedimento</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                  <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Por Unidade</h4>
                  <div class="overflow-x-auto">
                    <table class="w-full text-xs text-left">
                      <thead>
                        <tr class="border-b border-slate-800 text-slate-400">
                          <th class="py-2">Unidade</th>
                          <th class="py-2 text-right">Vendas</th>
                          <th class="py-2 text-right">Ticket Médio</th>
                        </tr>
                      </thead>
                      <tbody>
                        ${data.tickets?.by_unit?.map(item => `
                          <tr class="border-b border-slate-800/40 text-slate-300">
                            <td class="py-2 font-semibold">${item.unidade}</td>
                            <td class="py-2 text-right">${item.vendas}</td>
                            <td class="py-2 text-right font-black text-cyan-400">${formatCurrency(item.ticket_medio)}</td>
                          </tr>
                        `).join('') || '<tr><td colspan="3" class="text-center py-4 text-slate-500">Sem dados</td></tr>'}
                      </tbody>
                    </table>
                  </div>
                </div>
                <div>
                  <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Por Procedimento</h4>
                  <div class="overflow-x-auto">
                    <table class="w-full text-xs text-left">
                      <thead>
                        <tr class="border-b border-slate-800 text-slate-400">
                          <th class="py-2">Procedimento</th>
                          <th class="py-2 text-right">Vendas</th>
                          <th class="py-2 text-right">Ticket Médio</th>
                        </tr>
                      </thead>
                      <tbody>
                        ${data.tickets?.by_procedure?.map(item => `
                          <tr class="border-b border-slate-800/40 text-slate-300">
                            <td class="py-2 font-semibold">${item.procedimento}</td>
                            <td class="py-2 text-right">${item.vendas}</td>
                            <td class="py-2 text-right font-black text-violet-400">${formatCurrency(item.ticket_medio)}</td>
                          </tr>
                        `).join('') || '<tr><td colspan="3" class="text-center py-4 text-slate-500">Sem dados</td></tr>'}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;

        // Render Financial Unit Chart
        const unitCanvas = document.getElementById('financialUnitChart');
        if (unitCanvas && data.revenue?.by_unit?.length) {
          const labels = data.revenue.by_unit.map(u => u.unidade);
          const values = data.revenue.by_unit.map(u => u.receita);

          new Chart(unitCanvas, {
            type: 'bar',
            data: {
              labels: labels,

                borderWidth: 1,
                borderRadius: 6
              }]

            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false }

                      <span class="font-bold text-slate-400">${stage.quantity} leads (${stage.percentage}%)</span>

                    <div class="w-full bg-slate-900 rounded-full h-2 border border-slate-800">

          new Chart(funnelCanvas, {
            type: 'bar',
            data: {
              labels: labels,
              datasets: [{
                label: 'Leads',
                data: values,
                backgroundColor: colors,
                borderColor: '#1e293b',
                borderWidth: 1,
                borderRadius: 4

            options: {
              responsive: true,
              maintainAspectRatio: false,
              indexAxis: 'y',
              plugins: {
                legend: { display: false }

                y: { grid: { display: false }, ticks: { color: '#f1f5f9', font: { weight: 'bold' } } }

                  </tr>
                </thead>
                <tbody>
                  ${reps.map((rep, idx) => {

                    const position = idx < 3 ? trophies[idx] : `#${idx + 1}`;
                    return `
                      <tr class="border-b border-slate-800/40 hover:bg-slate-900/30 text-slate-300">
                        <td class="py-3.5 px-2 font-bold">${position}</td>
                        <td class="py-3.5 px-2">

                        <td class="py-3.5 px-2 text-right font-black text-emerald-400">${formatCurrency(rep.receita)}</td>

                    `;
                  }).join('') || '<tr><td colspan="6" class="text-center py-6 text-slate-500">Nenhum dado comercial no período</td></tr>'}

              </table>

          </div>

                      </tr>
                    `).join('') || '<tr><td colspan="4" class="text-center py-6 text-slate-500">Sem atividades de follow-up registradas</td></tr>'}

                  <i data-lucide="clock" class="w-4 h-4"></i> Atenção à Resolução

          const overdue = data.followup?.overdue_count || 0;

          new Chart(taskCanvas, {
            type: 'doughnut',
            data: {
              labels: ['Pendentes', 'Concluídas', 'Atrasadas'],
              datasets: [{
                data: [open - overdue, completed, overdue],
                backgroundColor: ['#06b6d4', '#10b981', '#f43f5e'],
                borderColor: '#0f172a',
                borderWidth: 2
              }]

            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  position: 'bottom',
                  labels: { color: '#cbd5e1', font: { family: 'Inter', size: 10 } }

                  <i data-lucide="trending-down" class="w-4 h-4 text-rose-400"></i> Motivos de Perda
                </h3>
                <p class="text-xs text-slate-400 mt-1">Distribuição de contatos perdidos por motivo alegado</p>

              <div class="h-64 w-full mt-6">
                <canvas id="lossesChart"></canvas>
              </div>
            </div>

                  <table class="w-full text-left text-xs">

                      <tr class="border-b border-slate-800 text-slate-400">

                        <th class="py-2 text-right">Vendas</th>
                        <th class="py-2 text-right">Conversão</th>
                        <th class="py-2 text-right">Receita</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${data.origins?.by_origin?.map(o => `
                        <tr class="border-b border-slate-800/40 text-slate-300">
                          <td class="py-2 font-semibold">${o.origem}</td>
                          <td class="py-2 text-right">${o.vendas}</td>
                          <td class="py-2 text-right text-amber-400">${o.conversao}%</td>
                          <td class="py-2 text-right font-black text-emerald-400">${formatCurrency(o.receita)}</td>
                        </tr>
                      `).join('') || '<tr><td colspan="4" class="text-center py-4 text-slate-500">Sem dados</td></tr>'}
                    </tbody>
                  </table>
                </div>

                <div>
                  <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Análise de Motivos de Perda</h4>
                  <table class="w-full text-left text-xs">
                    <thead>
                      <tr class="border-b border-slate-800 text-slate-400">
                        <th class="py-2">Motivo</th>
                        <th class="py-2 text-right">Quantidade</th>
                        <th class="py-2 text-right">Percentual</th>
                        <th class="py-2 text-right">Valor Perdido</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${data.losses?.reasons?.map(r => `
                        <tr class="border-b border-slate-800/40 text-slate-300">
                          <td class="py-2 font-semibold">${r.motivo}</td>
                          <td class="py-2 text-right">${r.quantidade}</td>
                          <td class="py-2 text-right text-rose-400">${r.percentual}%</td>
                          <td class="py-2 text-right font-black text-slate-300">${formatCurrency(r.valor_perdido)}</td>
                        </tr>
                      `).join('') || '<tr><td colspan="4" class="text-center py-4 text-slate-500">Sem dados</td></tr>'}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        `;

        // Render Origins Chart
        const originsCanvas = document.getElementById('originsChart');
        if (originsCanvas && data.origins?.by_origin?.length) {
          const labels = data.origins.by_origin.map(o => o.origem);
          const values = data.origins.by_origin.map(o => o.receita);

          new Chart(originsCanvas, {
            type: 'doughnut',
            data: {
              labels: labels,
              datasets: [{
                data: values,
                backgroundColor: ['#06b6d4', '#8b5cf6', '#10b981', '#f59e0b', '#ec4899', '#6366f1'],
                borderColor: '#0f172a',
                borderWidth: 2
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  position: 'bottom',
                  labels: { color: '#cbd5e1', font: { family: 'Inter', size: 10 } }
                }
              }
            }
          });
        }

        // Render Losses Chart
        const lossesCanvas = document.getElementById('lossesChart');
        if (lossesCanvas && data.losses?.reasons?.length) {
          const labels = data.losses.reasons.map(r => r.motivo);
          const values = data.losses.reasons.map(r => r.quantidade);

          new Chart(lossesCanvas, {
            type: 'bar',
            data: {
              labels: labels,
              datasets: [{
                label: 'Perdas (Qtd)',
                data: values,
                backgroundColor: 'rgba(244, 63, 94, 0.75)',
                borderColor: '#f43f5e',
                borderWidth: 1,
                borderRadius: 4
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              indexAxis: 'y',
              plugins: {
                legend: { display: false }
              },
              scales: {
                x: { grid: { color: '#1e293b' }, ticks: { color: '#64748b' } },
                y: { grid: { display: false }, ticks: { color: '#cbd5e1' } }
              }
            }
          });
        }
      }

      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    };

    // Initialize Page
    renderNavigation();
    renderDashboard();
  </script>
